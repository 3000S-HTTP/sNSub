name: Build subscriptions

# Rebuilds the subscription files on a schedule, on demand, and whenever the
# source list changes. Only output/ is committed back.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours (UTC)
  push:
    paths:
      - "sources.txt"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: build-subscriptions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache xray-core
        uses: actions/cache@v4
        with:
          path: .cache/xray
          key: xray-core-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            xray-core-${{ runner.os }}-

      - name: Build subscription files
        run: python scripts/build.py

      - name: Select the best working nodes (live proxy test)
        run: python scripts/tester.py --best 59 --limit 800 --workers 40 --timeout 6

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update subscriptions [skip ci]"
          # Retry: another push may have landed while we were testing.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              if git push; then echo "pushed"; exit 0; fi
            else
              # Keep this run's freshly generated output on conflict.
              git checkout --theirs -- output || true
              git add output || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1